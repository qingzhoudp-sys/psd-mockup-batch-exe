name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install pyinstaller pywin32
      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "PSD-Mockup-Batch"
          --collect-submodules win32com
          --hidden-import pythoncom
          --hidden-import pywintypes
          app.py
      - name: Verify PE executable
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("dist/PSD-Mockup-Batch.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE executable" }
      - name: Run packaged self-test
        run: dist\PSD-Mockup-Batch.exe --self-test
      - name: Upload tested EXE
        uses: actions/upload-artifact@v4
        with:
          name: PSD样机智能对象批量替换-Windows
          path: dist/PSD-Mockup-Batch.exe
          if-no-files-found: error
          retention-days: 30
